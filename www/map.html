<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Mapa z Regionami</title>
  <style>
  
    body {
      background: #222;
      color: #fff;
      text-align: center;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }

    .map-container {
      position: relative;
      display: inline-block;
      width: 90vw;
      max-width: 1000px;
    }

    .map-container img {
      width: 100%;
      display: block;
    }

    .map-container svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* domyślnie nieklikalne */
    }
  
    .world-popup {
      display:none;
      position:fixed; 
      top:-50px; 
      left:-20px; 
      width:110%;
      height:110%; 
      background:rgba(0,0,0,0.9);
      z-index:999; 
      align-items: center; 
      justify-content: center;
      flex-direction: column; 
      padding: 2em; 
      box-sizing: border-box; 
      color: white;  
    }

    .region {
      fill-opacity: 0.3;
      stroke: white;
      stroke-width: 2;
      cursor: pointer;
      transition: 0.3s;
      pointer-events: all; /* przywraca interakcję */
    }

    .region:hover {
      fill-opacity: 0.6;
    }
  
    .level-point {
      cursor: pointer;
      stroke: grey;
      stroke-width: 2;
      transition: transform 0.2s, fill 0.2s;
      pointer-events: all;
    }

    .level-point:hover {
      fill: #00ccff;
    }
  
    .level-point.locked {
      cursor: default;
      opacity: 0.4;
    }
  
    .level-point.unlocked {
      fill: white;
    }
    .level-point.passed {
      fill: green;
    }
  
    .hotspot-group {
     font-size: 11px; 
    }
  
    .popup-buttons {
      margin-top: 1em; 
      display: flex;
      gap: 1em; 
    } 
  
  </style>
</head>
<body>
  
  <h1>Mapa Regionów</h1>

  <!-- Nazwa regionu -->
  <h2 id="region-name" style="display:none; margin-top: 1em;"></h2>

  
  <div class="map-container">
    <!-- Podkład graficzny mapy -->
    <img data-src="img/maps/world-map.png" alt="Mapa Regionów">

    <!-- Nakładka SVG z regionami -->
    <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
      <!-- Region 1: Zielona północna część zachodniego kontynentu -->
      <polygon class="region" id="west" points="-200,0 420,0 420,130 200,390 400,591 -200,660" />

      <!-- Region 2: Pustynna południowa część zachodniego kontynentu + południowy pustynny kontynent -->
      <polygon class="region" id="south" points="-200,660 -200,1000 650,1000 800,740 550,574" />

      <!-- Region 3: Wchodni kontynent do gór, poza mroźną krainą -->
      <polygon class="region" id="east" points="690,370 960,210 1200,400 1200,1000 650,1000 800,740 550,574" />

      <!-- Region 4: Mroźna północno-wschodnia kraina -->
      <polygon class="region" id="north" points="420,0 1200,0 1200,400 960,210 690,370 420,130" />

      <!-- Region 5: Centralna wyspa z wulkanem -->
      <polygon class="region" id="island" points="420,130 690,370 550,574 400,591 200,390"/>
     
    </svg>
    
    <!-- Popup -->
    <div id="world-popup" class="world-popup">
      <h2 id="popup-region-title"></h2>
      <img id="region-image" src="" alt="Region" style="max-width: 90%; max-height: 400px; margin-bottom: 1em;"/>    
      
      <svg viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg" id="popup-hotspots">
        <!-- WEST region -->
        
        <g class="hotspot-group" data-region="west">
          <path class="level-point"
            id="level-west-1"
            data-level="1"
            data-region="west"
            transform="translate(170,240)"
            d="M0,-15 C6,-15 10,-10 10,-5 C10,2 0,15 0,15 C0,15 -10,2 -10,-5 C-10,-10 -6,-15 0,-15 Z"
            fill="yellow"
            stroke="#00ccff"
            stroke-width="2"
          />
          <text x="170" y="220" text-anchor="middle" fill="white" >Poziom 1</text>
        </g>
     
        <g class="hotspot-group" data-region="west">
          <path class="level-point locked"
            id="level-west-2"
            data-level="2"
            data-region="west"
            transform="translate(130,270)"
            d="M0,-15 C6,-15 10,-10 10,-5 C10,2 0,15 0,15 C0,15 -10,2 -10,-5 C-10,-10 -6,-15 0,-15 Z"
            fill="white"
            stroke="white"
            stroke-width="2"
          />
          <text x="130" y="250" text-anchor="middle" fill="white" >Poziom 2</text>
       </g>
        
       <g class="hotspot-group" data-region="west">
          <path class="level-point locked"
            id="level-west-3"
            data-level="3"
            data-region="west"
            transform="translate(180,300)"
            d="M0,-15 C6,-15 10,-10 10,-5 C10,2 0,15 0,15 C0,15 -10,2 -10,-5 C-10,-10 -6,-15 0,-15 Z"
            fill="white"
            stroke="white"
            stroke-width="2"
          />
          <text x="180" y="280" text-anchor="middle" fill="white" >Poziom 3</text>
       </g>
        
       <!-- SOUTH region -->
       <g class="hotspot-group" data-region="south">
          <path class="level-point"
            id="level-south-1"
            data-level="1"
            data-region="south"
            transform="translate(230,300)"
            d="M0,-15 C6,-15 10,-10 10,-5 C10,2 0,15 0,15 C0,15 -10,2 -10,-5 C-10,-10 -6,-15 0,-15 Z"
            fill="white"
            stroke="#00ccff"
            stroke-width="2"
          />
          <text x="230" y="280" text-anchor="middle" fill="white" >Poziom 1</text>
       </g>
        
       <g class="hotspot-group" data-region="south">
          <path class="level-point locked"
            id="level-south-2"
            data-level="2"
            data-region="south"
            transform="translate(195,310)"
            d="M0,-15 C6,-15 10,-10 10,-5 C10,2 0,15 0,15 C0,15 -10,2 -10,-5 C-10,-10 -6,-15 0,-15 Z"
            fill="white"
            stroke="#00ccff"
            stroke-width="2"
          />
          <text x="195" y="290" text-anchor="middle" fill="white" >Poziom 2</text>
      </g>
        
      <g class="hotspot-group" data-region="south">
          <path class="level-point locked"
            id="level-south-3"
            data-level="3"
            data-region="south"
            transform="translate(160,330)"
            d="M0,-15 C6,-15 10,-10 10,-5 C10,2 0,15 0,15 C0,15 -10,2 -10,-5 C-10,-10 -6,-15 0,-15 Z"
            fill="white"
            stroke="#00ccff"
            stroke-width="2"
          />
          <text x="160" y="310" text-anchor="middle" fill="white" >Poziom 3</text>
      </g>     
    </svg>    
          
      <div id="level-info" style="margin-bottom: 1em;"></div>
      
      <div id="popup-buttons" class="popup-buttons">
        <button id="enter-level-btn" style="display: none;">Wejdź</button>
        <button id="close-popup-btn" onclick="closePopUp()">Zamknij</button>
      </div>
   </div>
    
   
  </div>
    
  <!-- Przycisk --> 
  <button id="enter-world-btn" style="margin-top: 1em;">Przejdź do Świata</button>

  <script>

 
  const regionNames = {
    0: { id: "West", name: "Zachód", image: "img/maps/west-map3.png" },
    1: { id: "South", name: "Południe", image: "img/maps/south-map2.jpg" },
    2: { id: "East", name: "Wschód", image: "img/maps/east-map.png" },
    3: { id: "North", name: "Północ", image: "img/maps/region-north.png" },
    4: { id: "Island", name: "Wyspa", image: "img/maps/region-island.png" }
  };

  // const closePopupBtn = document.getElementById('close-popup-btn');

  let selectedRegion = null;
  let selectedLevel = null;
  let selectedRegionId = "";

  
function selectRegion() { 
  const regions = document.querySelectorAll('.region');
  const regionNameEl = document.getElementById('region-name');
  const enterWorldBtn = document.getElementById('enter-world-btn');

  regions.forEach((region, index) => {
    region.addEventListener('click', () => {
      const regionData = regionNames[index];
      if (!regionData) return;

      selectedRegion = regionData;
      
      selectedRegionId = regionNames[index].id.toLowerCase();
      console.log("region id", selectedRegionId);

      // Pokaż nazwę i przycisk
      regionNameEl.textContent = `Wybrany region: ${regionData.name}`;
      regionNameEl.style.display = 'block';
      enterWorldBtn.style.display = 'inline-block';
    });
  });
}
  
function enterWorld() { 
  console.log("selected image before", selectedRegion.image);
  const enterWorldBtn = document.getElementById('enter-world-btn');
  const worldPopup = document.getElementById('world-popup');
  const popupTitle = document.getElementById('popup-region-title');
  const regionImage = document.getElementById('region-image');
  const levelInfo = document.getElementById('level-info');
 
  enterWorldBtn.addEventListener('click', () => {
    if (!selectedRegion) return;

    popupTitle.textContent = `Region: ${selectedRegion.name}`;
    console.log("selected image", selectedRegion.image);
    regionImage.src = ASSET_BASE + selectedRegion.image;
    console.log("region image", regionImage.src);
   
    // Pokaż popup
    worldPopup.style.display = 'flex';
    
    // Ukryj wszystkie hotspoty
    document.querySelectorAll('.hotspot-group').forEach(group => {
      group.style.display = 'none';
    });

    // Pokaż tylko te z wybranego regionu
    document.querySelectorAll(`.hotspot-group[data-region="${selectedRegion.id.toLowerCase()}"]`).forEach(group => {
      group.style.display = 'inline';
    });

    document.getElementById('enter-level-btn').style.display = 'none';
    selectedLevel = null;
    
    levelInfo.textContent = ''; // wyczyść info o poziomie
  });
}

function enterLevel() {  
  document.getElementById('enter-level-btn').addEventListener('click', () => {
    if (selectedLevel && selectedRegion) {
    
      if (!selectedRegion || !selectedRegion.name) {
        console.warn("Nie wybrano regionu!");
        return;
      }
  
      const regionId = selectedRegion.id.toLowerCase();
      const currentId = `level-${regionId}-${selectedLevel}`;
      const nextId = `level-${regionId}-${selectedLevel + 1}`;

      const currentLevelPoint = document.getElementById(currentId);
      const nextLevelPoint = document.getElementById(nextId);
      
      console.log("selectedRegion", selectedRegion.name);
      console.log("selectedLevel", selectedLevel);
      
      if (nextLevelPoint) {
        nextLevelPoint.classList.remove('locked');
        nextLevelPoint.classList.add("unlocked");
        currentLevelPoint.classList.add("passed");
        console.log("nextLevelPoint", nextLevelPoint);
      }

      alert(`Wchodzisz do poziomu ${selectedLevel} w regionie ${selectedRegion.name}`);
    }
  });
}
  
function closePopUp() {
   const worldPopup = document.getElementById('world-popup');
   worldPopup.style.display = 'none';
}
  
 window.onload = function () {
   selectRegion();
   enterWorld();
   enterLevel();
   
   document.querySelectorAll("[data-src]").forEach(img => {
         img.src = `${ASSET_BASE}${img.getAttribute("data-src")}`;
      });
 
   
   document.querySelectorAll('.level-point').forEach(point => {
    point.addEventListener('click', () => {
      console.log("before locked check");
      if (point.classList.contains('locked')) return;
     
      selectedLevel = parseInt(point.dataset.level);
      console.log("level", selectedLevel);
      document.getElementById('enter-level-btn').style.display = 'inline-block';
    });
  });

};
  
  </script>
  
 <script src="js/config.js"></script>

</body>
</html>
