name: Build APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Verify Capacitor dependencies
        run: |
          npm ls @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem
          npx cap --version

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Verify generated Android integration
        run: |
          test -d android/capacitor-cordova-android-plugins
          test -f android/capacitor-cordova-android-plugins/cordova.variables.gradle
          test -f android/app/capacitor.build.gradle
          echo "Capacitor generated Android integration files successfully."

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        id: verify_apk
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          APK_SIZE=$(stat -c%s "$APK_PATH")
          test "$APK_SIZE" -gt 0
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "APK size: $APK_SIZE bytes"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: origin-enhanced-edition-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
