name: Build APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  build:
    name: Build Android signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Verify Capacitor dependencies
        run: |
          npm ls @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          npx cap --version

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Verify generated Android integration
        run: |
          test -d android/capacitor-cordova-android-plugins
          test -f android/capacitor-cordova-android-plugins/cordova.variables.gradle
          test -f android/app/capacitor.build.gradle
          echo "Capacitor generated Android integration files successfully."

      - name: Restore persistent Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/origin-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Persistent Android keystore restored in runner temporary storage."

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Remove keystore from runner
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ] && [ -f "$ANDROID_KEYSTORE_FILE" ]; then
            rm -f "$ANDROID_KEYSTORE_FILE"
          fi

      - name: Verify signed APK and Android version
        id: verify_apk
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          BADGING=$("$AAPT" dump badging "$APK_PATH")
          printf '%s\n' "$BADGING" | grep -F "package: name='com.poul12.rpglooter' versionCode='3' versionName='1.0.2'"
          APK_SIZE=$(stat -c%s "$APK_PATH")
          test "$APK_SIZE" -gt 0
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "Signed release APK verified: $APK_SIZE bytes."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: origin-enhanced-edition-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
